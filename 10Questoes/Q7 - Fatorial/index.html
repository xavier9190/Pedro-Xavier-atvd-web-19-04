<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q7 - Fatorial</title>
</head>
<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
    }
    #saida, #container {
        margin-top: 20px;
    }
    input, button {
        padding: 10px;
        font-size: 20px;
    }

</style>
<body>
    <div id="container">
        <input type="text" id="numero">
        <div id="saida"></div>
        <button onclick="
            var n = document.getElementById('numero').value;
            var fat = 1;
            for (var i=1; i<=n; i++) fat = fat * i;
            document.getElementById('saida').innerHTML = 'O fatorial de ' + n + ' é ' + fat;
        ">Calcular</button>
    </div>
</body>
</html>
