<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q9 - Array 20 números</title>
</head>
    <style>
        body {
            background-color: #2b2b2b;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background-color: #3d3d3d;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 800px;
            width: 100%;
            overflow-x: auto;
        }
        input, select, button {
            padding: 10px;
            margin: 5px;
            border-radius: 5px;
            border: none;
            font-size: 16px;
            outline: none;
        }
        button {
            background-color: #007bff;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            color: #ffffff;
        }
        th, td {
            border: 1px solid #555;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #555;
        }
    </style>
<body>
    <div class="card">
        <button onclick="
            var tabela = document.getElementById('tabela');
            tabela.innerHTML = ''; 
            
            var numerosOriginal = [];
            for (var i = 0; i < 20; i++) {
                numerosOriginal.push(Math.floor(Math.random() * 100));
            }
            
            document.getElementById('array').innerHTML = '<h3>Array original:<br>' + numerosOriginal.join(', ') + '</h3><h3>Array ordenado:</h3>';
            
            var numeros = numerosOriginal.slice();
            
            for (var i = 0; i < numeros.length; i++) {
                for (var j = 0; j < numeros.length - 1 - i; j++) {
                    if (numeros[j] > numeros[j + 1]) {
                        var temp = numeros[j];
                        numeros[j] = numeros[j + 1];
                        numeros[j + 1] = temp;
                    }
                }
            }

            var linha = document.createElement('tr');
            for (var i = 0; i < numeros.length; i++) {
                var celula = document.createElement('td');
                var numero = numeros[i];
                celula.innerText = numero;
                celula.style.border = '1px solid black';
                celula.style.padding = '10px 15px';
                celula.style.color = 'white';
                
                if (numero % 2 === 0) {
                    celula.style.backgroundColor = 'blue';
                } else {
                    celula.style.backgroundColor = 'green';
                }
                linha.appendChild(celula);
            }

            tabela.appendChild(linha);
        ">Gerar números na Tabela
        
        </button>

    <div id="array"></div>

    <table id="tabela" style="margin-top: 30px; border-collapse: collapse;"></table>
    </div>
</body>
</html>
