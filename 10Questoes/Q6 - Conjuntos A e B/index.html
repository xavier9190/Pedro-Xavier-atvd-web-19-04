<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q6 - Conjuntos A e B</title>
    <style>
        body {
            background-color: #2b2b2b;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background-color: #3d3d3d;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 800px;
            width: 100%;
            overflow-x: auto;
        }
        input, select, button {
            padding: 10px;
            margin: 5px;
            border-radius: 5px;
            border: none;
            font-size: 16px;
            outline: none;
        }
        button {
            background-color: #007bff;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            color: #ffffff;
        }
        th, td {
            border: 1px solid #555;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #555;
        }
    </style>
</head>
<body>
    <div class="card">
    <input type="text" id="vetorA" placeholder="Vetor A *max 10 elementos">
    <input type="text" id="vetorB" placeholder="Vetor B *max 10 elementos">
    <button onclick="

    //----------------------------------------------------
        var vetorA = document.getElementById('vetorA').value.split(',');
        var vetorB = document.getElementById('vetorB').value.split(',');
        var saida = document.getElementById('saida');

        var intersecao = [];
        var uniao = vetorA.slice();
        var diferenca = [];

        for (var i=0; i<vetorA.length; i++) {
            for (var j=0; j<vetorB.length; j++) {
                if (vetorA[i] === vetorB[j]) { var jaExiste = false;
                    for (var k=0; k<intersecao.length; k++) if (intersecao[k] === vetorA[i]) jaExiste = true;
                    if (!jaExiste) intersecao.push(vetorA[i]);
                }
            }
        }

        for (var i=0; i<vetorB.length; i++) {
            var tem = false;
            for (var j=0; j<uniao.length; j++) 
            if (uniao[j] === vetorB[i]) tem = true;
            if (!tem) uniao.push(vetorB[i]);
        }

        for (var i=0; i<vetorA.length; i++) {
            var tem = false;
            for (var j=0; j<vetorB.length; j++) if (vetorB[j] === vetorA[i]) tem = true;
            if (!tem) diferenca.push(vetorA[i]);
        }

        var AcontidoB = true;
        for (var i=0; i<vetorA.length; i++) {
            var achou = false;
            for (var j=0; j<vetorB.length; j++) if (vetorA[i] === vetorB[j]) achou = true;
            if (!achou) AcontidoB = false;
        }
        var BcontidoA = true;
        for (var i=0; i<vetorB.length; i++) {
            var achou = false;
            for (var j=0; j<vetorA.length; j++) if (vetorB[i] === vetorA[j]) achou = true;
            if (!achou) BcontidoA = false;
        }

        
        var html = '';
        html += '<h3>Vetor A = [' + vetorA + ']</h3>';
        html += '<h3>Vetor B = [' + vetorB + ']</h3>';
        html += '<h3>Interseção = [' + intersecao + ']</h3>';
        html += '<h3>União = [' + uniao + ']</h3>';
        html += '<h3>Diferença (A - B) = [' + diferenca + ']</h3>';
        html += '<h3>A contido em B? ' + (AcontidoB ? 'Sim' : 'Não') + '</h3>';
        html += '<h3>B contido em A? ' + (BcontidoA ? 'Sim' : 'Não') + '</h3>';
        
        saida.innerHTML = html;

    //----------------------------------------------------

    ">Seguir</button>

    <div id="saida"></div>

    
    </div>
</body>
</html>
