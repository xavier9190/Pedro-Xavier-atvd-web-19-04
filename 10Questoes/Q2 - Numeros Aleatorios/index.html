<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2 - Numeros Aleatorios</title>
</head>
    <style>
        body {
            background-color: #2b2b2b;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background-color: #3d3d3d;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 800px;
            width: 100%;
            overflow-x: auto;
        }
        input, select, button {
            padding: 10px;
            margin: 5px;
            border-radius: 5px;
            border: none;
            font-size: 16px;
            outline: none;
        }
        button {
            background-color: #007bff;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            color: #ffffff;
        }
        th, td {
            border: 1px solid #555;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #555;
        }
    </style>
<body>
    <div class="card">
        <div id="tabela"></div>
    </div>

    <script>
        var nums = [];
        var pares = [];
        var impares = [];
        var todosOrd = [];
        var paresMenor50 = [];
        var imparesOrd = [];

        for (var i=0; i<10; i++) { nums.push( Math.floor(Math.random()*100) + 1 ); } // todos os numeros

        for (var i=0; i<nums.length; i++) { if (nums[i] % 2 === 0) pares.push(nums[i]); } // numeros pares

        for (var i=0; i<nums.length; i++) { if (nums[i] % 2 !== 0) impares.push(nums[i]); } // numeros impares

        todosOrd = nums.slice().sort((a, b) => a - b); // numeros ordenados

        for (var i=0; i<pares.length; i++) { if (pares[i] < 50) paresMenor50.push(pares[i]); } // numeros pares menores que 50

        imparesOrd = impares.slice().sort((a, b) => a - b); // numeros impares ordenados

        var html = '<table class="minha-tabela"><tr><th>Descrição</th><th>Valores</th></tr>';
        html += '<tr><td>Todos os números</td><td>' + nums + '</td></tr>';
        html += '<tr><td>Apenas pares</td><td>' + pares + '</td></tr>';
        html += '<tr><td>Apenas ímpares</td><td>' + impares + '</td></tr>';
        html += '<tr><td>Todos ordenados</td><td>' + todosOrd + '</td></tr>';
        html += '<tr><td>Pares < 50 ordenados</td><td>' + paresMenor50 + '</td></tr>';
        html += '<tr><td>Ímpares ordenados</td><td>' + imparesOrd + '</td></tr>';
        html += '</table>';
        
        document.getElementById('tabela').innerHTML = html;

    </script>
</body>
</html>
